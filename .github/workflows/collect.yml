
name: Capture Tunnel occupancy

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r tunnel-occupancy/collector/requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Read and save occupancy
        run: python tunnel-occupancy/collector/scrape.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload diagnostics if collection fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: collector-diagnostics
          path: |
            collector-diagnostic.json
            collector-diagnostic.png
          if-no-files-found: ignore
